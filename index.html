<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log Masuk</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: #0f0e0c;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  /* Animated background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(212,175,55,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(212,175,55,0.06) 1px, transparent 1px);
    background-size: 40px 40px;
    animation: gridShift 20s linear infinite;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(212,175,55,0.08) 0%, transparent 70%);
    pointer-events: none;
  }

  @keyframes gridShift {
    0% { transform: translate(0, 0); }
    100% { transform: translate(40px, 40px); }
  }

  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 420px;
    padding: 20px;
    animation: fadeUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) both;
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* Top label */
  .eyebrow {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .eyebrow-line {
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,0.4));
  }

  .eyebrow-line.right {
    background: linear-gradient(90deg, rgba(212,175,55,0.4), transparent);
  }

  .eyebrow-text {
    font-size: 11px;
    letter-spacing: 0.18em;
    color: rgba(212,175,55,0.7);
    text-transform: uppercase;
    font-weight: 500;
  }

  /* Card */
  .card {
    background: rgba(20, 18, 14, 0.92);
    border: 1px solid rgba(212,175,55,0.18);
    border-radius: 4px;
    padding: 44px 40px 40px;
    backdrop-filter: blur(12px);
    position: relative;
    overflow: hidden;
  }

  .card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, rgba(212,175,55,0.5), transparent);
  }

  /* Corner accents */
  .corner {
    position: absolute;
    width: 16px; height: 16px;
    border-color: rgba(212,175,55,0.5);
    border-style: solid;
  }
  .corner.tl { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
  .corner.tr { top: 10px; right: 10px; border-width: 1px 1px 0 0; }
  .corner.bl { bottom: 10px; left: 10px; border-width: 0 0 1px 1px; }
  .corner.br { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; }

  /* Lock icon */
  .icon-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 52px; height: 52px;
    border: 1px solid rgba(212,175,55,0.25);
    border-radius: 4px;
    margin: 0 auto 24px;
    position: relative;
  }

  .icon-wrap svg {
    width: 24px; height: 24px;
    stroke: #d4af37;
    fill: none;
    stroke-width: 1.5;
  }

  h1 {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    font-weight: 400;
    color: #f0e6c8;
    text-align: center;
    margin-bottom: 6px;
    letter-spacing: -0.01em;
  }

  .subtitle {
    font-size: 13px;
    color: rgba(240,230,200,0.45);
    text-align: center;
    margin-bottom: 36px;
    letter-spacing: 0.02em;
  }

  /* Form */
  .field { margin-bottom: 20px; }

  label {
    display: block;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(212,175,55,0.7);
    margin-bottom: 8px;
    font-weight: 500;
  }

  input[type="password"], input[type="text"] {
    width: 100%;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(212,175,55,0.18);
    border-radius: 3px;
    padding: 13px 16px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    color: #f0e6c8;
    letter-spacing: 0.04em;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }

  input:focus {
    border-color: rgba(212,175,55,0.6);
    background: rgba(212,175,55,0.05);
  }

  input::placeholder { color: rgba(240,230,200,0.2); }

  /* Show password toggle */
  .input-wrap { position: relative; }

  .toggle-pw {
    position: absolute;
    right: 14px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: rgba(212,175,55,0.5);
    padding: 4px;
    transition: color 0.2s;
  }
  .toggle-pw:hover { color: rgba(212,175,55,0.9); }
  .toggle-pw svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 1.5; }

  /* Error */
  .error-msg {
    display: none;
    background: rgba(220, 60, 60, 0.12);
    border: 1px solid rgba(220,60,60,0.3);
    border-radius: 3px;
    padding: 10px 14px;
    font-size: 13px;
    color: #e88;
    margin-bottom: 18px;
    text-align: center;
    animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both;
  }

  @keyframes shake {
    10%, 90% { transform: translateX(-2px); }
    20%, 80% { transform: translateX(3px); }
    30%, 50%, 70% { transform: translateX(-4px); }
    40%, 60% { transform: translateX(4px); }
  }

  /* Button */
  button[type="submit"] {
    width: 100%;
    padding: 14px;
    background: rgba(212,175,55,0.12);
    border: 1px solid rgba(212,175,55,0.45);
    border-radius: 3px;
    color: #d4af37;
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s, border-color 0.2s, transform 0.1s;
    position: relative;
    overflow: hidden;
    margin-top: 4px;
  }

  button[type="submit"]:hover {
    background: rgba(212,175,55,0.22);
    border-color: rgba(212,175,55,0.7);
  }

  button[type="submit"]:active { transform: scale(0.99); }

  button[type="submit"].loading {
    pointer-events: none;
    color: transparent;
  }

  button[type="submit"].loading::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 18px; height: 18px;
    margin: -9px 0 0 -9px;
    border: 2px solid rgba(212,175,55,0.3);
    border-top-color: #d4af37;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
  }

  @keyframes spin { to { transform: rotate(360deg); } }

  /* Footer */
  .footer-note {
    font-size: 12px;
    color: rgba(240,230,200,0.25);
    text-align: center;
    margin-top: 28px;
    letter-spacing: 0.03em;
  }

  /* SUCCESS STATE */
  .success-overlay {
    display: none;
    position: absolute;
    inset: 0;
    background: rgba(20,18,14,0.97);
    border-radius: 4px;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 16px;
    z-index: 10;
    animation: fadeIn 0.4s ease both;
  }

  .success-overlay.show { display: flex; }

  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .check-circle {
    width: 60px; height: 60px;
    border: 1px solid rgba(100, 200, 120, 0.4);
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
  }

  .check-circle svg {
    width: 28px; height: 28px;
    stroke: #6dc87a;
    fill: none;
    stroke-width: 1.5;
    stroke-dasharray: 50;
    stroke-dashoffset: 50;
    animation: drawCheck 0.5s 0.1s ease forwards;
  }

  @keyframes drawCheck { to { stroke-dashoffset: 0; } }

  .success-text {
    font-family: 'DM Serif Display', serif;
    font-size: 20px;
    color: #f0e6c8;
  }

  .success-sub {
    font-size: 13px;
    color: rgba(240,230,200,0.4);
  }
</style>
</head>
<body>

<div class="container">
  <div class="eyebrow">
    <div class="eyebrow-line"></div>
    <span class="eyebrow-text">Kawasan Terhad</span>
    <div class="eyebrow-line right"></div>
  </div>

  <div class="card">
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- SUCCESS OVERLAY -->
    <div class="success-overlay" id="successOverlay">
      <div class="check-circle">
        <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
      </div>
      <div class="success-text">Akses Dibenarkan</div>
      <div class="success-sub">Mengalihkan...</div>
    </div>

    <!-- Lock icon -->
    <div class="icon-wrap">
      <svg viewBox="0 0 24 24">
        <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
        <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
      </svg>
    </div>

    <h1>Log Masuk</h1>
    <p class="subtitle">Masukkan kata laluan untuk teruskan</p>

    <div id="errorMsg" class="error-msg">
      ✕ &nbsp;Kata laluan tidak betul. Cuba sekali lagi.
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="field">
        <label for="username">Nama Pengguna</label>
        <input type="text" id="username" placeholder="Masukkan nama pengguna" autocomplete="username" />
      </div>

      <div class="field">
        <label for="password">Kata Laluan</label>
        <div class="input-wrap">
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
          <button type="button" class="toggle-pw" onclick="togglePw()" aria-label="Tunjuk/sorok kata laluan">
            <svg id="eyeIcon" viewBox="0 0 24 24"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div id="errorMsg2" class="error-msg"></div>

      <button type="submit" id="submitBtn">Masuk</button>
    </form>

    <p class="footer-note">Hubungi pentadbir jika terlupa kata laluan</p>
  </div>
</div>

<script>
  // ==============================================
  // TETAPAN — UBAH DI SINI
  // ==============================================
  const CREDENTIALS = [
    { username: "stafjka",    password: "jka@ptsb" },
    { username: "stafjke", password: "jke@ptsb" },
     { username: "stafjkm",    password: "jkm@ptsb" },
    { username: "stafjp", password: "jp@ptsb" },
     { username: "stafjpa",    password: "jpa@ptsb" },
    { username: "stafjmsk", password: "jmsk@ptsb" },
     { username: "stafsokongan",    password: "sokongan@ptsb" },
    // Tambah lebih banyak pengguna di sini:
    // { username: "nama",  password: "kata-laluan" },
  ];

  // URL yang dibuka selepas login berjaya
  const REDIRECT_URL = "https://sites.google.com/ptsb.edu.my/upjk-ptsb/utama";
  // ==============================================

  let attempts = 0;
  const MAX_ATTEMPTS = 5;

  function handleLogin(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const err = document.getElementById('errorMsg');
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;

    if (attempts >= MAX_ATTEMPTS) {
      showError("Terlalu banyak cubaan. Sila muat semula halaman.");
      return;
    }

    btn.classList.add('loading');
    err.style.display = 'none';

    // Simulate slight delay for UX
    setTimeout(() => {
      const match = CREDENTIALS.find(
        c => c.username === username && c.password === password
      );

      if (match) {
        document.getElementById('successOverlay').classList.add('show');
        setTimeout(() => {
          window.open(REDIRECT_URL, '_blank');
        }, 1800);
      } else {
        attempts++;
        btn.classList.remove('loading');
        showError(
          attempts >= MAX_ATTEMPTS
            ? "Akaun dikunci. Sila muat semula halaman."
            : `Nama pengguna atau kata laluan tidak betul. (${MAX_ATTEMPTS - attempts} cubaan tinggal)`
        );
      }
    }, 700);
  }

  function showError(msg) {
    const err = document.getElementById('errorMsg');
    err.textContent = '✕   ' + msg;
    err.style.display = 'block';
    err.style.animation = 'none';
    void err.offsetWidth;
    err.style.animation = 'shake 0.4s cubic-bezier(.36,.07,.19,.97) both';
  }

  function togglePw() {
    const pw = document.getElementById('password');
    const icon = document.getElementById('eyeIcon');
    if (pw.type === 'password') {
      pw.type = 'text';
      icon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>`;
    } else {
      pw.type = 'password';
      icon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>`;
    }
  }
</script>
</body>
</html>
